name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for a solution file
        id: sln
        run: |
          if ls *.sln *.slnx >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up .NET
        if: steps.sln.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.sln.outputs.found == 'true'
        run: dotnet restore

      - name: Build
        if: steps.sln.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: steps.sln.outputs.found == 'true'
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Nothing to build yet
        if: steps.sln.outputs.found != 'true'
        run: echo "No solution file yet, backend steps skipped."

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build --if-present

      - name: Test
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadless

      - name: Nothing to build yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "No frontend yet, frontend steps skipped."
