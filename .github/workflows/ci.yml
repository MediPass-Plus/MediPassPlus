name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MediPassPlus.slnx

      - name: Build
        run: dotnet build MediPassPlus.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MediPassPlus.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run build --if-present

      - name: Test
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm test --if-present -- --watch=false

      - name: Nothing to build yet
        if: hashFiles('frontend/package.json') == ''
        run: echo "No frontend yet, frontend steps skipped."
